[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketpulse-mcp"
version = "0.5.0"
description = "MarketPulse MCP — real-time market intelligence pipeline and MCP skill server for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Abhinaysai Kamineni" }]
keywords = ["kafka", "mcp", "market-data", "streaming", "anomaly-detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
    "confluent-kafka>=2.6.0",
    "httpx>=0.28.0",
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    "python-dateutil>=2.9.0",
    "mcp>=1.1.0",
    "numpy>=2.1.0",
]

[project.optional-dependencies]
real-data = [
    "yfinance>=0.2.50",
]
embeddings = [
    "sentence-transformers>=3.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
marketpulse-api = "marketpulse.api.app:main"
marketpulse-mcp = "marketpulse.mcp.server:main"
marketpulse-produce-stock = "marketpulse.producers.stock_producer:main"
marketpulse-produce-news = "marketpulse.producers.mock_news_producer:main"
marketpulse-stock-consumer = "marketpulse.consumers.stock_consumer:main"
marketpulse-news-consumer = "marketpulse.consumers.news_consumer:main"
marketpulse-processor = "marketpulse.consumers.stream_processor:main"

[tool.hatch.build.targets.wheel]
packages = ["src/marketpulse"]

[tool.hatch.build.targets.wheel.sources]
"src/marketpulse" = "marketpulse"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
